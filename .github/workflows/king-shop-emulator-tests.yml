name: KING SHOP Rewards & Firestore Rules Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'server/kingShopBackend.ts'
      - 'src/services/kingShopFrontendService.ts'
      - 'src/components/KingShopRewardsSection.tsx'
      - 'src/components/KingShopAdminSection.tsx'
      - 'tests/kingShop.*.test.ts'

jobs:
  king-shop-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Required for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: TypeScript Lint & Vite Build
        run: npm run lint && npm run build

      - name: Run Isolated KING Shop Runtime Tests
        run: npm run test:shop:runtime

      - name: Run Firestore Security Rules & Emulator Suite
        run: npm run test:shop:rules
